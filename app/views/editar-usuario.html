<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBook - Editar Usuário</title>
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    {{ template "script" }}
    <script src="/assets/devbook/publicacao.js"></script> <!-- Adicionando o script para validar o formulário -->
    <script src="/assets/devbook/help.js"></script> <!-- Adicionando o script para validar o formulário -->
    <script src="/assets/devbook/usuario.js"></script> <!-- Adicionando o script para validar o formulário -->
</head>

<body>
    {{ template "cabecalho" }}

    <div class="container-fluid">
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Editar Usuário</h5>
                        <p class="card-text">
                        <form id="editar-usuario" method="POST" enctype="multipart/form-data">
                            <div class="form-group">
                                <label for="nome">Nome</label>
                                <input type="text" name="nome" id="nome" class="form-control" value="{{ .Nome }}">
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" name="email" id="email" class="form-control" value="{{ .Email }}">
                            </div>
                            <div class="form-group">
                                <label for="nick">Nick</label>
                                <input type="text" name="nick" id="nick" class="form-control" value="{{ .Nick }}">
                            </div>
                            <input type="hidden" name="id" value="{{ .Id }}">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </form>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {{ template "rodape" }}
</body>

</html>
