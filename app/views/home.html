<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBook - Página Principal</title>
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    {{ template "script" }}
    <script src="/assets/devbook/publicacao.js"></script> <!-- Adicionando o script para validar o formulário -->
</head>

<body>
    {{ template "cabecalho" }}
    <div class="container-fluid">
        <div class="row mt-4">
            <div class="col-xs-12 col-sm-12 col-md-5 col-lg-5 col-xl-5">
                <!--Formulário-->
                <h3>Nova Publicação</h3>
                <fieldset>
                    <form id="nova-publicacao" method="post" enctype="application/x-www-form-urlencoded">
                        <div class="form-group">
                            <label for="titulo">Titulo</label>
                            <input type="text" class="form-control" name="titulo" id="titulo"
                                placeholder="Digite o titulo" required>
                        </div>
                        <div class="form-group">
                            <label for="conteudo">Conteúdo</label>
                            <textarea class="form-control resize-none" name="conteudo" id="conteudo" rows="3"
                                placeholder="Digite o conteudo" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Publicar</button>
                    </form>
                </fieldset>
            </div>
            <div class="col-xs-12 col-sm-12 col-md-7 col-lg-7 col-xl-7">
                <span class="data-usuario-id">{{ $.IdUsuario }}</span>
                {{ range .Publicacoes }}
                {{ if (eq .AutorId $.IdUsuario) }}
                {{ template "publicacao-com-permissao" . }}
                {{ else }}
                {{ template "publicacao-sem-permissao" . }}
                {{ end }}
                {{ end }}
            </div>
        </div>
    </div>


    {{ template "rodape" }}

</body>

</html>
